# Prediction recorded before pack completion:
# - Expected asserted properties:
#   incident-002.incident_open = true / INFERRED.
#   incident-002.name_resolution_status = ok / INFERRED.
#   incident-002.network_path_status = ok / INFERRED.
#   incident-002.tls_status = no_answer / INFERRED. This is deliberately not
#   predicted as tls_failure because a timed-out certificate probe says nothing
#   about certificate quality.
#   incident-002.db_lag_margin = 870 / INFERRED.
#   incident-002.ad_lag_margin = 1500 / INFERRED.
#   incident-002.dependency_status = CONFLICTING, because R050 and R051 infer
#   different database states from simultaneously true facts.
#   incident-002.auth_dependency_status = CONFLICTING, because R060 and R061
#   infer different directory states from simultaneously true facts.
#   incident-002.root_cause = CONFLICTING, because R104 and R105 both infer
#   plausible but different root-cause candidates.
#   incident-002.explained_root_cause = DIRECTORY / INFERRED.
# - Expected rules to fire: R001, R010, R020, R030, R050, R051, R060, R061,
#   R104, R105. R040 should not fire because tls_status is no_answer, not ok.
# - Least certain: the explanation score. I expect DIRECTORY to narrowly beat
#   DATABASE because it explains auth_error_seen as correlated support with
#   ad_lag_high, while DATABASE explains two database observations. If the
#   engine penalizes unexplained healthy observations differently than I read
#   the brief, this may be wrong.
# - Domain caveat: I believe a single ranked DIRECTORY answer is too tidy here.
#   A real engineer should keep database and directory accounts open and ask
#   for a separating observation, such as a local DB login from the web tier
#   and an LDAP bind from a non-app host.
