      - id: operation
        type: operation
        properties:
          - name: service
            value: write
            status: KNOWN
          - name: target_safety_class
            value: process_critical
            status: KNOWN
          - name: requested_value_class
            value: configuration
            status: KNOWN

    policy:
      high_reliability: 800
      corroboration_required: 1
      freshness_window: 100

    sources:
      - id: ocsp-primary
        reliability: 930
        independence_group: pki-online
      - id: crl-mirror
        reliability: 880
        independence_group: pki-offline

    evidence:
      - id: E001
        subject: cert
        predicate: revoked
        value: false
        source: ocsp-primary
        reliability: 910
        observed_at: 1995
      - id: E002
        subject: cert
        predicate: revoked
        value: true
        source: crl-mirror
        reliability: 860
        observed_at: 1990

  expect:
    properties:
      - subject: endpoint.mode_policy_ok
        value: false
        status: INFERRED
      - subject: cert.revoked
        status: CONFLICTING
      - subject: channel.channel_secure
        value: false
        status: INFERRED
      - subject: session.session_assurance
        value: weak
        status: INFERRED
      - subject: operation.request_risk
        value: moderate
        status: INFERRED
      - subject: operation.access_decision
        status: CONFLICTING
      - subject: operation.permit_write
        value: false
        status: INFERRED
      - subject: server.posture_region
        value: legacy_exposed
        status: INFERRED
      - subject: operation.preferred_explanation
        value: LEGACY_ENDPOINT
        status: INFERRED
