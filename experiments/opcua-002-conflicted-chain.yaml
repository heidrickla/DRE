# Prediction recorded before execution.
#
# This is the non-obvious case. It combines fixed-point features, conflicting
# evidence, rules that should decline when certificate revocation is
# CONFLICTING, a token-expiry denial, weak username identity, moderate write
# classification, geometry classification, and competing explanations.
#
# Expected asserted properties:
# - server.crypto_score = -64, INFERRED
# - server.exposure_score = 120, INFERRED
# - endpoint.mode_policy_ok = false, INFERRED
# - cert.revoked = CONFLICTING with no value, because two independent groups
#   each meet corroboration_required=1 for different boolean values
# - cert.trust_ok should remain unreadable/absent, not false, because the
#   engine should not let R004 or R005 read a CONFLICTING revocation value
# - channel.token_age_margin = -10, INFERRED
# - channel.renew_required = true, INFERRED
# - channel.channel_secure = false, INFERRED
# - session.user_authorized = true, INFERRED
# - session.session_assurance = weak, INFERRED
# - operation.request_risk = moderate, INFERRED
# - operation.write_requires_approval = false, INFERRED
# - operation.access_decision = CONFLICTING, because R015 says deny and R019
#   says manual_review. The domain answer I would prefer is deny, but the
#   brief says priority does not resolve conflicting inferred values.
# - operation.permit_write = false, INFERRED
# - operation.audit_required = true, INFERRED
# - server.posture_region = legacy_exposed, INFERRED
# - operation.preferred_explanation = LEGACY_ENDPOINT, INFERRED
#
# Expected rules to fire: R001, R008, R012, R014, R015, and R019. I expect
# R005 not to fire even though one source says revoked=true, because evidence
# resolution should make cert.revoked CONFLICTING rather than KNOWN true.
#
# Least certain: two rules will infer operation.access_decision differently:
# R015 infers deny and R019 infers manual_review. The brief says two rules
# concluding different values for one property give CONFLICTING. I predict
# this case may therefore disagree with my desired domain answer. My specific
# falsifiable prediction is that the engine will mark access_decision
# CONFLICTING, not deny, even though I think OPC UA policy should let channel
# failure dominate weak identity. If it instead preserves deny because R015
# fires first, that will show an engine conflict/overwrite behavior I did not
# understand from the brief.
experiment:
  id: opcua-002-conflicted-chain
  description: Expired token, weak identity, weak crypto, and conflicting revocation evidence.
  pack: model-packs/opc-ua-access

  given:
    now: 2000
    entities:
      - id: endpoint
        type: endpoint
        properties:
          - name: security_mode
            value: sign_and_encrypt
            status: KNOWN
          - name: security_policy
