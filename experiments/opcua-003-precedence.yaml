      - id: operation
        type: operation
        properties:
          - name: service
            value: write
            status: KNOWN
          - name: target_safety_class
            value: process_critical
            status: KNOWN
          - name: requested_value_class
            value: configuration
            status: KNOWN

    policy:
      high_reliability: 800
      corroboration_required: 1
      freshness_window: 100

    sources:
      - id: ocsp-primary
        reliability: 930
        independence_group: pki-online
      - id: crl-mirror
        reliability: 880
        independence_group: pki-offline

    evidence:
      - id: E001
        subject: cert
        predicate: revoked
        value: false
        source: ocsp-primary
        reliability: 910
        observed_at: 1995
      - id: E002
        subject: cert
        predicate: revoked
        value: true
        source: crl-mirror
        reliability: 860
        observed_at: 1990

  expect:
    properties:
      - subject: operation.access_decision
        value: deny
        status: INFERRED
      # Untouched: evidence disagreeing about a fact is not a policy
      # question, and precedence is declared on inference only.
      - subject: cert.revoked
        status: CONFLICTING
