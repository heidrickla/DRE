            status: KNOWN
          - name: expiry_margin_days
            value: {fixed: "14"}
            status: KNOWN
          - name: trust_anchor_score
            value: 900
            status: KNOWN
          - name: revocation_source_score
            value: 700
            status: KNOWN

      - id: session
        type: session
        properties:
          - name: auth_method
            value: username
            status: KNOWN
          - name: auth_evidence_score
            value: 650
            status: KNOWN
          - name: session_active
            value: true
            status: KNOWN

      - id: server
        type: server
        properties:
          - name: internet_exposure_score
            value: 80
            status: KNOWN
          - name: anonymous_surface_score
            value: 40
            status: KNOWN
          - name: production_role
            value: safety_control
            status: KNOWN
          - name: write_policy
            value: allow
            status: KNOWN
          - name: allow_anonymous
            value: false
