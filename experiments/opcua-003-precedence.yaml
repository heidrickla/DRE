# The same conflict, with the domain's own answer declared.
#
# PREDICTION, RECORDED BEFORE THE FIRST RUN
# =========================================
# Identical evidence to opcua-002-conflicted-chain, identical rules. The only
# difference is that `access_decision` declares
# `precedence: [deny, manual_review, allow]`.
#
# R015 infers `deny` and R019 infers `manual_review`. Instead of merging to
# CONFLICTING and discarding the value, the declared order settles it:
#
#   operation.access_decision = deny [Inferred]
#
# and the proof carries a TIE-BREAK naming what dominated what. Everything
# else in the run should be unchanged from -002, including `cert.revoked`
# staying CONFLICTING -- that one is two sources disagreeing about a fact,
# which precedence deliberately does not touch.

experiment:
  id: opcua-003-precedence
  description: Expired token, weak identity, weak crypto, and conflicting revocation evidence.
  pack: model-packs/opc-ua-access-precedence

  given:
    now: 2000
    entities:
      - id: endpoint
        type: endpoint
        properties:
          - name: security_mode
            value: sign_and_encrypt
            status: KNOWN
          - name: security_policy
            value: basic128rsa15
            status: KNOWN
          - name: policy_strength
            value: 128
            status: KNOWN
          - name: min_policy_required
            value: 192
            status: KNOWN
          - name: deprecated_policy
            value: false
            status: KNOWN

      - id: channel
        type: channel
        properties:
          - name: revised_lifetime
            value: {fixed: "3600"}
            status: KNOWN
          - name: token_age
            value: {fixed: "3610"}
