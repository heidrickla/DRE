experiment:
  id: checkout-layer-falsifiable-002
  description: >-
    The same follow-up measurement, come back normal instead of high.

    The pack's author predicted that a normal storage reading would leave
    SHARED_STORAGE_STALL "actively refuted", and chose to measure it on those
    grounds. In the pack as written it refutes nothing, because
    `datastore_write_latency_high` and `..._normal` are separate one-way
    booleans and concluding one leaves the other UNKNOWN. Against the variant
    where each measurement is one property with both polarities inferred, the
    refutation lands and the leading account changes.
  pack: model-packs/checkout-layer-diagnosis-falsifiable

  given:
    now: 1000
    policy:
      high_reliability: 800
      corroboration_required: 1
      freshness_window: 100
    sources:
      - id: apm
        reliability: 900
        independence_group: telemetry
      - id: lb-metrics
        reliability: 860
        independence_group: edge
      - id: db-monitor
        reliability: 900
        independence_group: database
      - id: storage-array
        reliability: 920
        independence_group: storage

    entities:
      - id: incident
        type: incident
        properties:
          - name: api_baseline_p95_ms
            value: 180
            status: KNOWN
          - name: db_baseline_p95_ms
            value: 45
            status: KNOWN
          - name: datastore_baseline_write_p95_ms
            value: 8
            status: KNOWN
          - name: db_lock_wait_ms
            status: UNKNOWN
          - name: hypervisor_cpu_ready_pct
            status: UNKNOWN

    evidence:
      - id: E001
        subject: incident
        predicate: checkout_error_rate_pct
        value: {fixed: "4.8"}
        source: apm
        reliability: 900
        observed_at: 997
      - id: E002
        subject: incident
        predicate: api_p95_ms
        value: 760
        source: apm
        reliability: 900
        observed_at: 997
      - id: E003
        subject: incident
        predicate: app_pool_wait_pct
        value: {fixed: "28.0"}
        source: apm
        reliability: 880
        observed_at: 996
      - id: E004
        subject: incident
        predicate: db_p95_ms
        value: 235
        source: db-monitor
        reliability: 900
        observed_at: 996
      - id: E005
        subject: incident
        predicate: lb_app2_retry_share_pct
        value: {fixed: "61.0"}
        source: lb-metrics
        reliability: 860
        observed_at: 998
      - id: E006
        subject: incident
        predicate: app2_health_flaps_10m
        value: 4
        source: lb-metrics
        reliability: 860
        observed_at: 998
      - id: E007
        subject: incident
        predicate: datastore_write_p95_ms
        value: 15
        source: storage-array
        reliability: 920
        observed_at: 999

  expect:
    properties:
      - subject: incident.datastore_write_latency_high
        value: false
        status: INFERRED
      # No `root_cause`. Two accounts score exactly 2.400000 and the ranking
      # writes a conclusion only where one is both supported and strictly
      # ahead, so the property is left UNKNOWN on purpose.
      - subject: incident.root_cause
        status: UNKNOWN
    rules_fired: 7
    states_expanded: 0
