# The same device, the same cascade, with the defective sensor replaced by
# a working one that agrees with the independent instrument.
#
# PREDICTION, RECORDED BEFORE THE FIRST RUN
# =========================================
# 1. tc-17 and ir-22 now agree on 95 across two independence groups, so
#    `temperature` resolves KNOWN.
# 2. R020 fires, `overheating` becomes true, and R040 concludes THERMAL.
# 3. R030 still concludes POWER.
# 4. Two rules infer different values for one property, so `root_cause`
#    merges to CONFLICTING and the engine reaches no diagnosis.
#
# If that holds, removing a defect made the answer WORSE, and the engine
# has no way to prefer the explanation covering four observations over the
# one covering a single reading.

experiment:
  id: device-cascade-002
  description: >-
    A power rail fails, four subsystems on it report errors, and one of
    those subsystems also reports an out-of-range temperature. Run against
    the engine unchanged, to find where the current model breaks.
  pack: model-packs/device-cascade

  given:
    now: 1000
    policy:
      high_reliability: 800
      corroboration_required: 2
      freshness_window: 100

    sources:
      # Independent instrument on its own supply. This one is telling the
      # truth about the rail.
      - id: vm-3
        reliability: 900

      # The controller and the thermocouple are both powered by rail A.
      # One failure, one voice -- which is what the group declares.
      - id: controller-a
        reliability: 900
        independence_group: rail-a
      - id: tc-17
        reliability: 900
        independence_group: rail-a

      # A different instrument on a different supply, reading a genuinely
      # elevated temperature. This is the misleading independent
      # observation: true, relevant, and not the root cause.
      - id: ir-22
        reliability: 900

      - id: door-sw
        reliability: 900

    evidence:
      - id: E001
        subject: boiler-1
        predicate: rail_voltage
        value: 150
        source: vm-3
        reliability: 900
        observed_at: 990

      # The cascade. Four symptoms, one cause, all on rail A.
      - id: E010
        subject: boiler-1
        predicate: temp_sensor_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990
      - id: E011
        subject: boiler-1
        predicate: pressure_sensor_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990
      - id: E012
        subject: boiler-1
        predicate: flow_sensor_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990
      - id: E013
        subject: boiler-1
        predicate: comms_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990

      # The defective reading. 9999 against a declared max of 200.
      - id: E020
        subject: boiler-1
        predicate: temperature
        value: 95
        source: tc-17
        reliability: 900
        observed_at: 990

      # The valid one, from a healthy instrument.
      - id: E021
        subject: boiler-1
        predicate: temperature
        value: 95
        source: ir-22
        reliability: 900
        observed_at: 990

      # Unrelated to the rail, and true.
      - id: E030
        subject: boiler-1
        predicate: door_open
        value: false
        source: door-sw
        reliability: 900
        observed_at: 990

    entities:
      - id: boiler-1
        type: device
        properties:
          # The missing observation. Nothing measures it and nothing
          # derives it.
          - name: coolant_level
          - name: power_fault
          - name: sensors_degraded
          - name: overheating
          - name: root_cause

  expect:
    properties:
      - subject: boiler-1.root_cause
        status: CONFLICTING
