# Experiment 5: reasoning that starts with arithmetic.
#
#   input power   = 1000 W
#   output power  =  820 W
#   rated output  =  900 W
#
# Nothing here is a conclusion yet. Efficiency, load and loss all have to
# be computed before a single rule can be evaluated, and both geometric
# axes are derived — so if the feature layer failed, this experiment would
# not merely get a different answer, it would get no answer at all.
#
# The pump is efficient (82%) but running past its rating (91% of 900 W),
# so the advice is to ease off rather than to service it. That distinction
# is drawn by two rules of equal priority separated on specificity, which
# is why R004 is considered before R003 despite appearing after it.

experiment:
  id: process-001
  description: >-
    Pump performance from derived quantities. Exercises arithmetic
    features, a feature reading another feature, rules over fixed-point
    values, and classification on axes that are computed rather than
    measured.
  pack: model-packs/process

  given:
    entities:
      - id: pump
        type: pump
        properties:
          - name: input_power
            value: 1000
            status: KNOWN
          - name: output_power
            value: 820
            status: KNOWN
          - name: rated_output
            value: 900
            status: KNOWN

  expect:
    properties:
      # 820 / 1000, exactly. A rule could not have concluded this.
      - subject: pump.efficiency
        value: { fixed: "0.82" }
        status: INFERRED

      # F001 reads F002, which is declared after it. Fixpoint order, not
      # file order.
      - subject: pump.efficiency_percent
        value: { fixed: "82" }
        status: INFERRED

      # 820 / 900 = 0.911111..., truncated at six decimals by Fixed, then
      # scaled. The trailing digits are the point: this is exact
      # fixed-point arithmetic, not a rounded float.
      - subject: pump.load_percent
        value: { fixed: "91.1111" }
        status: INFERRED

      - subject: pump.power_loss
        value: { fixed: "180" }
        status: INFERRED

      # 91.1111% of rated output is over the ninety percent line.
      - subject: pump.overloaded
        value: true
        status: INFERRED

      # 0.82 is not below 0.70, so R001 must not fire and `degraded` must
      # never come into existence. Asserted by its absence from this list
      # and by the rules_fired count below.
      - subject: pump.advice
        value: reduce-load
        status: INFERRED

      - subject: pump.nearest_region
        value: OVERLOADED
        status: INFERRED

    # R002 and R003. R001 and R004 are evaluated and do not fire.
    rules_fired: 2
    states_expanded: 0
