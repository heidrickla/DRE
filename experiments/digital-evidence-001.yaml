experiment:
  id: digital-evidence-001
  description: >-
    Straightforward case: complete custody, corroborated hash verification,
    and corroborated metadata consistency should produce admissible triage.
  pack: model-packs/digital-evidence-triage

  given:
    now: 1000
    entities:
      - id: artifact-1
        type: artifact
        properties:
          - name: acquisition_complete
            value: true
            status: KNOWN
          - name: custody_records
            value: 5
            status: KNOWN
          - name: required_custody_records
            value: 5
            status: KNOWN
          - name: isolated
            value: false
            status: KNOWN
          - name: analyst_reviewed
            value: false
            status: KNOWN
          - name: secondary_hash_verified
            value: false
            status: KNOWN
          - name: case_ready
            value: false
            status: KNOWN

    policy:
      high_reliability: 800
      corroboration_required: 1
      freshness_window: 100

    sources:
      - id: acquisition-tool
        reliability: 950
        independence_group: acquisition
      - id: case-audit
        reliability: 900
        independence_group: audit

    evidence:
      - id: E001
        subject: artifact-1
        predicate: hash_verified
        value: true
        source: acquisition-tool
        reliability: 950
        observed_at: 995
      - id: E002
        subject: artifact-1
        predicate: metadata_consistent
        value: true
        source: case-audit
        reliability: 900
        observed_at: 994

  expect:
    properties:
      - subject: artifact-1.custody_gap
        value: {fixed: "0"}
        status: INFERRED
      - subject: artifact-1.custody_complete
        value: true
        status: INFERRED
      - subject: artifact-1.provenance_quality
        value: strong
        status: INFERRED
      - subject: artifact-1.authenticity_support
        value: sufficient
        status: INFERRED
      - subject: artifact-1.triage_status
        value: admissible
        status: INFERRED
    rules_fired: 4
    plan_length: 4
    plan: [ISOLATE_ARTIFACT, ANALYST_REVIEW, SECONDARY_HASH_VERIFY, FINALIZE_CASE]
