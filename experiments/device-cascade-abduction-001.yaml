# Rules alone said CONFLICTING. The explanation layer is asked the same
# question.
#
# PREDICTION, RECORDED BEFORE THE FIRST RUN
# =========================================
# Six observations hold: the rail is under 200, all four subsystem errors
# are true, and the temperature resolves to 95, which is over ninety. The
# door is shut, so `door_ajar` does not hold and neither account is charged
# for ignoring it.
#
#   POWER    2.40   coverage 2.75 (1.00 rail + 1.75 for four correlated
#                   symptoms), less 0.25 for leaving `overheating`
#                   unexplained and 0.10 for two mechanisms
#   THERMAL  0.90   coverage 2.00, less 1.00 for four unexplained
#                   observations and 0.10 for two mechanisms
#
# So `root_cause` = POWER [Inferred], with a margin of 1.50, and the proof
# carries an EXPLAINS node for each hypothesis rather than only the winner.
#
# The number worth watching is 1.75 rather than 4.00. A count of symptoms
# would have given POWER 5.00 of coverage and the right answer for the
# reason recommendation 11 warns against.

experiment:
  id: device-cascade-abduction-001
  description: >-
    The decisive case, and the same one `device-cascade-002` fails. Every
    reading is sound, so both accounts are live: the rail is down, four
    subsystems on it are erroring, and the device really is above ninety
    degrees.

    Under rules alone this is CONFLICTING -- two correct rules concluding
    two different root causes, with nothing able to weigh them. Here the
    same evidence is ranked.
  pack: model-packs/device-cascade-abduction

  given:
    now: 1000
    policy:
      high_reliability: 800
      corroboration_required: 2
      freshness_window: 100

    sources:
      # Independent instrument on its own supply. This one is telling the
      # truth about the rail.
      - id: vm-3
        reliability: 900

      # The controller and the thermocouple are both powered by rail A.
      # One failure, one voice -- which is what the group declares.
      - id: controller-a
        reliability: 900
        independence_group: rail-a
      - id: tc-17
        reliability: 900
        independence_group: rail-a

      # A different instrument on a different supply, reading a genuinely
      # elevated temperature. This is the misleading independent
      # observation: true, relevant, and not the root cause.
      - id: ir-22
        reliability: 900

      - id: door-sw
        reliability: 900

    evidence:
      - id: E001
        subject: boiler-1
        predicate: rail_voltage
        value: 150
        source: vm-3
        reliability: 900
        observed_at: 990

      # The cascade. Four symptoms, one cause, all on rail A.
      - id: E010
        subject: boiler-1
        predicate: temp_sensor_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990
      - id: E011
        subject: boiler-1
        predicate: pressure_sensor_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990
      - id: E012
        subject: boiler-1
        predicate: flow_sensor_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990
      - id: E013
        subject: boiler-1
        predicate: comms_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990

      # The defective reading. 9999 against a declared max of 200.
      - id: E020
        subject: boiler-1
        predicate: temperature
        value: 95
        source: tc-17
        reliability: 900
        observed_at: 990

      # The valid one, from a healthy instrument.
      - id: E021
        subject: boiler-1
        predicate: temperature
        value: 95
        source: ir-22
        reliability: 900
        observed_at: 990

      # Unrelated to the rail, and true.
      - id: E030
        subject: boiler-1
        predicate: door_open
        value: false
        source: door-sw
        reliability: 900
        observed_at: 990

    entities:
      - id: boiler-1
        type: device
        properties:
          # The missing observation. Nothing measures it and nothing
          # derives it.
          - name: coolant_level
          - name: power_fault
          - name: sensors_degraded
          - name: overheating
          - name: root_cause

  expect:
    properties:
      - subject: boiler-1.root_cause
        value: POWER
        status: INFERRED
