# One power rail fails. Four things complain. One of the complainers is
# also lying about the temperature.
#
# PREDICTION, RECORDED BEFORE THE FIRST RUN
# =========================================
# 1. The reading of 9999 against a declared max of 200 is accepted without
#    complaint. `dre validate` passes and no property becomes INVALID.
# 2. tc-17 (9999) and ir-22 (95) disagree across two independence groups,
#    so `temperature` resolves to CONFLICTING.
# 3. R020 therefore cannot fire, `overheating` is never concluded, and the
#    seductive R040 never fires.
# 4. root_cause = POWER.
#
# So the engine is expected to reach the RIGHT answer for the WRONG reason:
# the defective sensor spoils the very reading that would have produced the
# wrong diagnosis. Remove the defect and the answer should get worse, which
# is what device-cascade-002 tests.

experiment:
  id: device-cascade-001
  description: >-
    A power rail fails, four subsystems on it report errors, and one of
    those subsystems also reports an out-of-range temperature. Run against
    the engine unchanged, to find where the current model breaks.
  pack: model-packs/device-cascade

  given:
    now: 1000
    policy:
      high_reliability: 800
      corroboration_required: 2
      freshness_window: 100

    sources:
      # Independent instrument on its own supply. This one is telling the
      # truth about the rail.
      - id: vm-3
        reliability: 900

      # The controller and the thermocouple are both powered by rail A.
      # One failure, one voice -- which is what the group declares.
      - id: controller-a
        reliability: 900
        independence_group: rail-a
      - id: tc-17
        reliability: 900
        independence_group: rail-a

      # A different instrument on a different supply, reading a genuinely
      # elevated temperature. This is the misleading independent
      # observation: true, relevant, and not the root cause.
      - id: ir-22
        reliability: 900

      - id: door-sw
        reliability: 900

    evidence:
      - id: E001
        subject: boiler-1
        predicate: rail_voltage
        value: 150
        source: vm-3
        reliability: 900
        observed_at: 990

      # The cascade. Four symptoms, one cause, all on rail A.
      - id: E010
        subject: boiler-1
        predicate: temp_sensor_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990
      - id: E011
        subject: boiler-1
        predicate: pressure_sensor_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990
      - id: E012
        subject: boiler-1
        predicate: flow_sensor_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990
      - id: E013
        subject: boiler-1
        predicate: comms_error
        value: true
        source: controller-a
        reliability: 900
        observed_at: 990

      # The defective reading. 9999 against a declared max of 200.
      - id: E020
        subject: boiler-1
        predicate: temperature
        value: 9999
        source: tc-17
        reliability: 900
        observed_at: 990

      # The valid one, from a healthy instrument.
      - id: E021
        subject: boiler-1
        predicate: temperature
        value: 95
        source: ir-22
        reliability: 900
        observed_at: 990

      # Unrelated to the rail, and true.
      - id: E030
        subject: boiler-1
        predicate: door_open
        value: false
        source: door-sw
        reliability: 900
        observed_at: 990

    entities:
      - id: boiler-1
        type: device
        properties:
          # The missing observation. Nothing measures it and nothing
          # derives it.
          - name: coolant_level
          - name: power_fault
          - name: sensors_degraded
          - name: overheating
          - name: root_cause

  expect:
    properties:
      # SUPERSEDED, and kept because the change is the finding.
      #
      # This asserted `value: POWER`, and that was correct for engine
      # 0.6.0 and correct for the reason recorded in the prediction above:
      # the defective 9999 spoiled the temperature, the overheating rule
      # could not fire, and the competing THERMAL explanation never
      # appeared. The right answer, reached because a sensor was lying.
      #
      # Engine 0.7.0 states the defect and excludes it from resolution, so
      # `temperature` now resolves from the one sound reading, `overheating`
      # fires, and both explanations are live. The engine cannot rank them.
      #
      # So fixing validation made this experiment stop producing the right
      # answer -- which is the correct outcome. The answer was an artefact
      # of the defect, and removing the artefact exposes the real gap.
      # `-001` and `-002` now agree, because the defect was the only thing
      # that distinguished them.
      - subject: boiler-1.root_cause
        status: CONFLICTING
