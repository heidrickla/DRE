# Prediction recorded before execution:
# Expected asserted properties:
# - web.mount_active resolves to false from two independent evidence groups.
# - web.last_failure_age is INFERRED as fixed 10.
# - web.recent_failure is INFERRED true.
# - web.required_mount_unavailable, critical_chain_affected, service_not_startable are INFERRED true.
# - web.likely_state is INFERRED failed.
# - web.manual_repair_required is not expected to be inferred because pressure_score is only 1.
# - web.root_cause is expected to be INFERRED MOUNT_PROBLEM.
# Expected rules to fire: R001, R003, R008, R009, R010.
# Expected features to compute: F001 and F002.
# Least certain: whether explanations write rank_into with INFERRED status, and whether
# explanation ranking is run by `dre run` or only by `dre explain`.
