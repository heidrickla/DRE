# Prediction recorded before execution:
# Expected asserted properties:
# - backup.mount_active resolves to false because two fresh independent groups agree.
# - backup.package_installed resolves to false because two fresh independent groups agree.
# - backup.module_loaded resolves to false; the positive lsmod observation is stale and
#   should not make the property CONFLICTING.
# - backup.last_failure_age is INFERRED as fixed 15 and pressure_score as fixed 3.
# - backup.recent_failure, required_mount_unavailable, dependency_failed,
#   module_blocked, default_target_blocked, critical_chain_affected,
#   service_not_startable, manual_repair_required are INFERRED true.
# - backup.likely_state is INFERRED failed.
# - backup.root_cause is expected to be SYSTEMIC_BOOT_PROBLEM.
# Expected rules to fire: R001, R003, R004, R005, R007, R008, R009, R010, R012.
# Expected features to compute: F001 and F002.
# Least certain:
# - Whether stale evidence is ignored before corroboration or still contributes a STALE status.
# - Whether a derived observation such as module_unavailable can support explanations in the
#   same run, since explanations execute after rules according to the brief.
# - Whether the engine accepts type-subject rank_into (`unit.root_cause`) for explanations.
# Domain caveat:
# I believe SYSTEMIC_BOOT_PROBLEM is the right domain answer only if this is a single outage
# wave. A real admin would also consider that three independent faults may be a bad snapshot
# or bad monitoring, which the two-level hypothesis format cannot express.
