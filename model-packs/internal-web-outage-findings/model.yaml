model:
  id: internal-web-outage-findings
  version: 0.1.0
  requires_engine: 0.19.0
  description: >-
    The independently authored `internal-web-outage` pack, unchanged except
    that three observations declare themselves negative findings.

    That pack is kept exactly as its author wrote it, because it is the
    evidence: they predicted DATABASE, the engine returned WEB_SERVICE, and
    they were right. The difference between the two packs is the whole
    finding -- an account was being rewarded for explaining that things are
    fine, and punished for not explaining why the working parts work.
